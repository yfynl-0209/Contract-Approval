# Alembic config (M9).
#
# NOTE: keep this file ASCII-only. configparser decodes it with the
# locale encoding (GBK on zh-CN Windows) and Chinese comments break it.
#
# The database URL is NOT set here: alembic/env.py resolves it by priority:
#   1. config.attributes["url"] (programmatic calls; one temp DB per test)
#   2. env var M9_DATABASE_URL
#   3. app/config.py settings.db_url (dev default, SQLite)
# The source of truth for SQLite remains db/schema.sql (init path);
# this directory holds the PostgreSQL baseline and future migrations.
# Structural parity between the two is enforced by tests.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
